name: Spec Build Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  DOC_IN: "${{ github.workspace }}/specification_documents"
  DOC_OUT: "${{ github.workspace }}/specification_documents/output"
  DOC_FILE: 'mzTab_format_specification_2_1-M.adoc'
  RELEASE_DIR: '2_1-metabolomics-release'

jobs:
  build-spec:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set build timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
      
      - name: Pull Asciidoctor Docker image
        # Keep in sync with ASCIIDOCTOR_IMAGE in build-docs.sh
        run: docker pull asciidoctor/docker-asciidoctor:1
      
      - name: Build specification documents
        run: |
          ./build-docs.sh \
            -i "$DOC_IN" \
            -o "$DOC_OUT" \
            -c "$GITHUB_SHA" \
            -d "$BUILD_DATE" \
            -f "$DOC_FILE"
        shell: bash
      
      - name: Prepare output directory
        run: |
          mkdir -p output/$RELEASE_DIR/img
          cp -v -R $DOC_OUT/* output/$RELEASE_DIR/
          cp -v -R $DOC_OUT/img/* output/$RELEASE_DIR/img/
          cp -v -R docs/* output/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: specification-documents
          path: |
            output/${{ env.RELEASE_DIR }}/*.pdf
            output/${{ env.RELEASE_DIR }}/*.html
            output/${{ env.RELEASE_DIR }}/*.docx
          retention-days: 90

  build-docs:
    name: Build Antora documentation
    needs: build-spec
    # Only for pushes and PRs. When called from release.yml, github.event_name is
    # the caller's event ('release'), and release.yml has its own publish-site job.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch --all

      - name: Create local tracking branches for existing release versions
        run: |
          for branch in $(git branch -r | grep 'origin/v' | sed 's|.*origin/||'); do
            git branch "$branch" "origin/$branch" 2>/dev/null || true
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Antora and extensions
        run: npm ci

      # The spec PDF/DOCX from build-spec become Antora attachments of the ROOT
      # module, linked from the Quick access box (xref:ROOT:attachment$...).
      # Antora reads the checked-out worktree, so untracked files are included.
      - name: Download specification documents
        uses: actions/download-artifact@v4
        with:
          name: specification-documents
          path: spec-artifact

      - name: Add specification PDF/DOCX as Antora attachments
        run: |
          mkdir -p docs/mztabm/modules/ROOT/attachments
          cp -v spec-artifact/*.pdf spec-artifact/*.docx docs/mztabm/modules/ROOT/attachments/

      - name: Build Antora site
        env:
          ANTORA_EDIT_BRANCH: main
        run: |
          npx antora antora-playbook.yml \
            --attribute "commit-hash=${{ github.sha }}" \
            --attribute "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/

  deploy-docs:
    name: Deploy documentation to GitHub Pages
    needs: build-docs
    # A merged PR also triggers a push to main, so deploying on push covers it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Shared with release.yml's publish-site so Pages deployments never overlap.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
