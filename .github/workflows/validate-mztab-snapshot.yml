name: Validate v2.1 (snapshot validator)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Development build of jmzTab-m, published as the 'dev-latest' pre-release
  # on every push to jmzTab-m's master branch.
  JMZTABM_REPO: 'lifs-tools/jmzTab-m'
  JMZTABM_TAG: 'dev-latest'
  VALIDATOR_ASSET: 'jmztabm-validator-amd64-linux'

jobs:
  LoadCodeBase:
    runs-on: ubuntu-latest

    steps:
      - name: Download jmzTab-m validator (${{ env.JMZTABM_TAG }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$JMZTABM_TAG" -R "$JMZTABM_REPO" -p "$VALIDATOR_ASSET" -O jmztabm-validator
          chmod +x jmztabm-validator
          ls -lh jmztabm-validator

      - name: Record validator version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dev-latest moves with every jmzTab-m push, so record what this run
          # validated with. The release notes list version, commit and build time;
          # the digest check ties them to the binary that was actually downloaded.
          gh release view "$JMZTABM_TAG" -R "$JMZTABM_REPO" --json body,assets > release.json
          EXPECTED=$(jq -r --arg a "$VALIDATOR_ASSET" '.assets[] | select(.name == $a) | .digest' release.json)
          ACTUAL="sha256:$(sha256sum jmztabm-validator | cut -d' ' -f1)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::warning title=Validator changed during download::${JMZTABM_TAG} was updated while this run downloaded it; the recorded version may not match the binary."
          fi
          {
            echo "### jmzTab-m validator"
            echo
            echo "[\`${JMZTABM_TAG}\`](https://github.com/${JMZTABM_REPO}/releases/tag/${JMZTABM_TAG}) pre-release, \`${VALIDATOR_ASSET}\` (\`${ACTUAL}\`)"
            echo
            jq -r .body release.json | grep -E '^- (Version|Commit|Built):' || echo "Version information not found in the release notes."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload validator as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmztab-validator
          path: jmztabm-validator
          if-no-files-found: error

  ValidateFiles:
    runs-on: ubuntu-latest
    needs: LoadCodeBase
    # The dev-latest validator changes with every jmzTab-m push; do not let a
    # validator regression fail the workflow. Failures still show up as
    # annotations and in the job summary.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Only example files that require mzTab-M 2.1 features live under
        # examples/2.1/. They are validated with the jmzTab-m dev-latest
        # (2.1.0-SNAPSHOT) native validator.
        include:
          - name: xcms
            pattern: "examples/2.1/xcms*"
            extra_args: ""
          - name: allMZTAB
            pattern: "examples/2.1/*.mztab"
            extra_args: ""

    name: Validate ${{ matrix.name }} files
    steps:
      - uses: actions/checkout@v4

      - name: Download validator
        uses: actions/download-artifact@v4
        with:
          name: jmztab-validator
          path: .

      - name: Validate ${{ matrix.name }} files
        env:
          VALIDATOR: ./jmztabm-validator
          # Profile advisories such as Warn-2056 (M+S+F without SME, "tolerated
          # but discouraged") are reported as warnings, not failures.
          FAIL_ON: error
        run: |
          # Artifacts do not preserve file permissions.
          chmod +x jmztabm-validator
          .github/scripts/validate-examples.sh "${{ matrix.pattern }}" ${{ matrix.extra_args }}
