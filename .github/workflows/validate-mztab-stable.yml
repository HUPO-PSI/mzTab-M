name: Validate v2.0.0 for stable code 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  JMZTABM_VERSION: '1.0.6'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  LoadCodeBase:
    runs-on: ubuntu-latest
    steps:
      - name: Download jmzTab-m CLI ${{ env.JMZTABM_VERSION }}
        run: |
          CLI_URL="https://repo1.maven.org/maven2/de/isas/mztab/jmztabm-cli/${JMZTABM_VERSION}/jmztabm-cli-${JMZTABM_VERSION}.jar"
          echo "Downloading ${CLI_URL}"
          curl -fsSL "${CLI_URL}" -o "jmztabm-cli-${JMZTABM_VERSION}.jar"
          ls -lh "jmztabm-cli-${JMZTABM_VERSION}.jar"

      - name: Upload CLI jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmztab-cli
          path: jmztabm-cli-*.jar
          if-no-files-found: error

  ValidateFiles:
    runs-on: ubuntu-latest
    needs: LoadCodeBase
    strategy:
      fail-fast: false
      matrix:
        # Only mzTab-M 2.0.0-conformant example files live under examples/2.0/.
        # They are validated with the released (stable) jmzTab-m CLI 1.0.6.
        # Files that require 2.1 features live under examples/2.1/ and are
        # validated by validate-mztab-snapshot.yml instead.
        include:
          - name: LDA
            pattern: "examples/2.0/LDA*"
            extra_args: ""
          - name: lipidcompass
            pattern: "examples/2.0/lipidcompass*"
            extra_args: ""
          - name: Manual
            pattern: "examples/2.0/manual*"
            extra_args: ""
          - name: masster
            pattern: "examples/2.0/masster*"
            extra_args: ""
          - name: MetaboScape
            pattern: "examples/2.0/MetaboScape*.json"
            extra_args: "--fromJson"
          - name: MS-DIAL
            pattern: "examples/2.0/msdial*"
            extra_args: ""
          - name: progenesis
            pattern: "examples/2.0/progenesis*.json"
            extra_args: "--fromJson"
          - name: allMZTAB
            pattern: "examples/2.0/*.mztab"
            extra_args: ""
          - name: allJSON
            pattern: "examples/2.0/*.json"
            extra_args: "--fromJson"

    name: Validate ${{ matrix.name }} files
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Download CLI jar
        uses: actions/download-artifact@v4
        with:
          name: jmztab-cli
          path: .

      - name: Validate ${{ matrix.name }} files
        env:
          VALIDATOR: java -jar jmztabm-cli-${{ env.JMZTABM_VERSION }}.jar
          # 2.0 examples must validate cleanly: warnings fail the file.
          FAIL_ON: warn
        run: .github/scripts/validate-examples.sh "${{ matrix.pattern }}" ${{ matrix.extra_args }}
